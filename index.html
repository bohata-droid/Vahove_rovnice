<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Váhové rovnice a soustavy</title>
<style>
:root{--i:#182236;--l:#ccd5e1;--b:#3157a4}*{box-sizing:border-box}body{margin:0;padding:28px 16px;min-height:100vh;color:var(--i);background:linear-gradient(145deg,#e8f0f8,#f7f3ea);font-family:Segoe UI,Arial}.app{position:relative;max-width:980px;margin:auto;padding:38px;border:1px solid #d8dee7;border-radius:24px;background:#fffffff2;box-shadow:0 18px 55px #24375221}h1{margin:0 0 18px;font-size:clamp(28px,5vw,42px)}button,select,input{min-height:44px;padding:9px 14px;border:1px solid var(--l);border-radius:10px;color:var(--i);background:#fff;font:650 15px Segoe UI,Arial}button{cursor:pointer}.primary,.switch .on{border-color:var(--b);color:#fff;background:var(--b)}.switch{display:inline-flex;margin-bottom:22px;padding:4px;border:1px solid var(--l);border-radius:13px;background:#eef2f7}.switch button{min-width:120px;border:0;background:transparent}.controls{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end}label{display:block;margin-bottom:7px;font-weight:700}.inputs{display:grid;gap:8px}input[type=text]{width:100%;min-height:48px;border:2px solid var(--l);font-size:19px}.actions,.options{display:flex;flex-wrap:wrap;gap:8px}.options{gap:12px 20px;margin:18px 0;padding:15px 17px;align-items:center;border:1px solid var(--l);border-radius:12px;background:#f8fafc}.option{display:flex;gap:8px;align-items:center}.option label{margin:0}.color{position:absolute;right:20px;top:20px;width:42px;padding:0;border-radius:50%;font-size:23px}.hide{display:none!important}.message{min-height:24px;margin-top:10px;color:#a92525;font-weight:650}.canvas-wrap{margin-top:20px;overflow:hidden;border:1px solid var(--l);border-radius:17px;background:#fff}canvas{display:block;width:100%;height:auto}.result{display:flex;min-height:72px;margin-top:18px;padding:14px;align-items:center;justify-content:center;border-radius:13px;background:#edf3ff;font-size:clamp(20px,4vw,28px);font-weight:750}dialog{width:min(470px,calc(100% - 28px));padding:24px;border:1px solid var(--l);border-radius:16px}.grid{display:grid;grid-template-columns:1fr 90px;gap:12px;align-items:center;margin:20px 0}.grid label{margin:0}.grid input{width:90px}.dlg{display:flex;justify-content:flex-end;gap:8px}.error{min-height:22px;color:#a92525;font-weight:650}@media(max-width:680px){body{padding:0}.app{padding:20px 14px;border:0}.controls{grid-template-columns:1fr}.options{align-items:flex-start;flex-direction:column}}@media print{.controls,.options,.message,.color,.switch{display:none}}
</style></head><body><main class="app"><button id="color" class="color">◐</button><h1 id="title">Váhové rovnice</h1><div class="switch"><button id="one" class="on">Rovnice</button><button id="two">Soustavy</button></div>
<div class="controls"><div><label id="inputLabel">Rovnice</label><div class="inputs"><input id="e1" readonly><input id="e2" class="hide" readonly></div></div><div class="actions"><button id="generate" class="primary">Nová rovnice</button><button id="custom">Vlastní rovnice</button></div></div>
<div class="options"><div class="option"><label id="diffLabel" for="diff">Výsledek:</label><select id="diff"><option value="natural">přirozené číslo</option><option value="integer">celé číslo</option><option value="positive">kladné číslo</option><option value="any">jakýkoli</option></select></div><div id="constants" class="option"><label>Konstanty:</label><select id="const"><option value="natural">přirozená čísla</option><option value="negative">záporná čísla</option></select></div><button id="toggle">Skrýt výsledek</button><button id="copy">Kopírovat obrázek</button><button id="worksheet">Pracovní list</button><button id="answers" disabled>Výsledky k listu</button></div>
<div id="message" class="message"></div><div class="canvas-wrap"><canvas id="canvas"></canvas></div><div id="solution" class="result"></div></main>
<dialog id="dialog"><h2 id="dialogTitle">Pracovní list</h2><div id="singleSettings" class="grid"><label>Jen kladné</label><input id="pc" type="number" min="0" max="10" value="4"><label>Jen celé</label><input id="ic" type="number" min="0" max="10" value="3"><label>I se zlomky</label><input id="fc" type="number" min="0" max="10" value="3"></div><p id="systemInfo" class="hide">List bude obsahovat 6 soustav ve zvolené obtížnosti, uspořádaných 2 × 3.</p><div id="sheetError" class="error"></div><div class="dlg"><button onclick="dialog.close()">Zrušit</button><button id="download" class="primary">Stáhnout PDF</button></div></dialog>
<script>
"use strict";const $=x=>document.getElementById(x),cv=$("canvas"),c=cv.getContext("2d"),ins=[$("e1"),$("e2")];let mode="one",cur,visible=true,mono=false,last=[];const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1}function frac(n,d){if(d<0)n=-n,d=-d;let g=gcd(n,d);return[n/g,d/g]}function num(q){return q[1]===1?""+q[0]:q.join("/")}
function parseSide(s,y=false){s=s.toLowerCase().replace(/[−–]/g,"-").replace(/\s/g,"");if(!s)throw Error("Na obou stranách musí být výraz.");s=/^[+-]/.test(s)?s:"+"+s;let ts=s.match(/[+-][^+-]+/g),o={x:0,y:0,c:0};if(!ts||ts.join("")!==s)throw Error("Výraz se nepodařilo přečíst.");for(let t of ts){let v=t.endsWith("x")?"x":t.endsWith("y")?"y":null;if(v){if(v==="y"&&!y)throw Error("Zde použij jen x.");let a=t.slice(0,-1);if(!/^[+-]\d*$/.test(a))throw Error("Neplatný člen.");o[v]+=a==="+"?1:a==="-"?-1:+a}else if(/^[+-]\d+$/.test(t))o.c+=+t;else throw Error("Použij x, "+(y?"y, ":"")+"celá čísla, + a −.")}return o}
function parseEq(s,y=false){let p=s.split("=");if(p.length!==2)throw Error("Každá rovnice musí mít právě jedno rovnítko.");let e={left:parseSide(p[0],y),right:parseSide(p[1],y)};for(let z of [e.left,e.right])if(z.x<0||z.y<0||z.x+z.y>7||Math.abs(z.c)>15)throw Error("Na misce smí být nejvýše 7 tvarů a konstanta od −15 do 15.");return e}function norm(e){return{a:e.left.x-e.right.x,b:e.left.y-e.right.y,d:e.right.c-e.left.c}}function solve(es){if(!Array.isArray(es)){let p=norm(es);return p.a?frac(p.d,p.a):null}let p=norm(es[0]),q=norm(es[1]),d=p.a*q.b-q.a*p.b;if(!d)return null;return{x:frac(p.d*q.b-q.d*p.b,d),y:frac(p.a*q.d-q.a*p.d,d)}}
function side(s,y=false){let a=[];function add(n,v){if(!n)return;let z=(Math.abs(n)==1?"":Math.abs(n))+v;a.push(a.length?(n>0?"+ ":"− ")+z:(n<0?"−":"")+z)}add(s.x,"x");if(y)add(s.y,"y");if(s.c||!a.length)a.push(a.length?(s.c>=0?"+ "+s.c:"− "+Math.abs(s.c)):""+s.c);return a.join(" ")}function text(e,y=false){return side(e.left,y)+" = "+side(e.right,y)}
function makeOne(kind){let neg=$("const").value==="negative";for(let k=0;k<2e4;k++){let a=ri(1,6),d=ri(1,6);if(a===d)continue;let b=ri(neg?-15:1,15),z=ri(neg?-15:1,15);if(b===0||z===0)continue;let q=frac(z-b,a-d);if(!q[0])continue;if(kind==="natural"&&(q[1]!=1||q[0]<1)||kind==="integer"&&q[1]!=1||kind==="positive"&&(q[1]<2||q[1]>5||q[0]<1)||kind==="fraction"&&(q[1]<2||q[1]>5)||kind==="any"&&q[1]>5)continue;let e={left:{x:a,y:0,c:b},right:{x:d,y:0,c:z}};return{data:e,lines:[text(e)]}}}
function val(kind){return kind==="natural"?ri(1,8):kind==="integer"?ri(-8,8):ri(1,16)/2}function makeSystem(kind){for(let k=0;k<1e4;k++){let x=val(kind),y=val(kind),es=[];for(let r=0;r<2;r++){let a=ri(1,4),b=ri(1,4),u=ri(0,a),v=ri(0,b),lc=ri(1,6),rc=lc+(a-u)*x+(b-v)*y;if(a+b>7||u+v>7||!Number.isInteger(rc)||rc<1||rc>15){r--;continue}es.push({left:{x:a,y:b,c:lc},right:{x:u,y:v,c:rc}})}let s=solve(es);if(s&&s.x[0]/s.x[1]===x&&s.y[0]/s.y[1]===y)return{data:es,lines:es.map(e=>text(e,true))}}}
function pal(){return mono?{bg:"#fff",ink:"#000",metal:"#fff",x:"#aaa",y:"#fff",box:"#fff"}:{bg:"#fbfdff",ink:"#172033",metal:"#8997ad",x:"#5f87d7",y:"#e8a04b",box:"#fff3d9"}}
function shape(x,y,t,p){c.save();c.strokeStyle=p.ink;c.lineWidth=2;if(t==="x"){c.beginPath();c.arc(x,y,14,0,Math.PI*2);c.fillStyle=p.x;c.fill();c.stroke();if(!mono){c.beginPath();c.arc(x-5,y-6,3.5,0,Math.PI*2);c.fillStyle="#ffffff88";c.fill()}}else{c.beginPath();c.moveTo(x,y-16);c.lineTo(x-15,y+11);c.quadraticCurveTo(x,y+16,x+15,y+11);c.closePath();c.fillStyle=p.y;c.fill();c.stroke();if(!mono){c.beginPath();c.moveTo(x-2,y-10);c.lineTo(x-8,y+7);c.strokeStyle="#ffffff66";c.lineWidth=2;c.stroke()}}c.restore()}
function constant(x,y,value,p){c.save();c.fillStyle=p.box;c.strokeStyle=p.ink;c.lineWidth=2;c.beginPath();c.roundRect(x-29,y-29,58,58,6);c.fill();c.stroke();c.fillStyle=p.ink;c.font="700 24px Segoe UI,Arial";c.textAlign="center";c.textBaseline="middle";c.fillText(value,x,y+1);c.restore()}
function pan(x,arm,s,p){let rim=arm-16,types=[];for(let i=0;i<s.x;i++)types.push("x");for(let i=0;i<s.y;i++)types.push("y");let cols=Math.min(3,types.length),shapeCenter=types.length?x-38:x,step=33;c.save();c.strokeStyle=p.ink;c.lineCap="round";c.beginPath();c.moveTo(x-86,rim);c.quadraticCurveTo(x,arm-1,x+86,rim);c.lineWidth=5;c.stroke();c.strokeStyle=p.metal;c.lineWidth=2;c.beginPath();c.moveTo(x-84,rim-1);c.quadraticCurveTo(x,arm-4,x+84,rim-1);c.stroke();types.forEach((t,i)=>{let row=Math.floor(i/3),count=Math.min(3,types.length-row*3),xx=shapeCenter-(count-1)*step/2+(i%3)*step,yy=rim-16-row*34;shape(xx,yy,t,p)});constant(types.length?x+47:x,rim-31,s.c,p);c.restore()}
function scale(e,top,h,p){let arm=top+h*.58,x=350,left=175,right=525;c.save();c.fillStyle=p.metal;c.strokeStyle=p.ink;c.lineWidth=2;c.beginPath();c.roundRect(x-9,arm+2,18,h*.29,5);c.fill();c.stroke();c.beginPath();c.moveTo(x-48,arm+h*.31);c.lineTo(x+48,arm+h*.31);c.lineTo(x+68,arm+h*.39);c.lineTo(x-68,arm+h*.39);c.closePath();c.fill();c.stroke();c.strokeStyle=p.ink;c.lineWidth=8;c.lineCap="round";c.beginPath();c.moveTo(left,arm);c.lineTo(right,arm);c.stroke();c.fillStyle=p.bg;c.beginPath();c.arc(x,arm,11,0,Math.PI*2);c.fill();c.strokeStyle=p.ink;c.lineWidth=2.5;c.stroke();pan(left,arm,e.left,p);pan(right,arm,e.right,p);c.restore()}
function draw(data=cur){let p=pal(),W=700,H=mode==="two"?490:260,d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;cv.style.aspectRatio=W+"/"+H;c.setTransform(d,0,0,d,0,0);c.fillStyle=p.bg;c.fillRect(0,0,W,H);c.strokeStyle=p.ink;if(mode==="two"){scale(data[0],0,235,p);scale(data[1],245,235,p)}else scale(data,0,245,p)}
function update(){if(!cur)return;if(!visible)$("solution").textContent="Výsledek je skrytý";else{let s=solve(cur);$("solution").textContent=mode==="two"?(s?"Výsledek: x = "+num(s.x)+", y = "+num(s.y):"Soustava nemá právě jedno řešení"):(s?"Výsledek: x = "+num(s):"Rovnice nemá právě jedno řešení")} $("toggle").textContent=visible?"Skrýt výsledek":"Ukázat výsledek"}function drawAll(){try{$("message").textContent="";cur=mode==="two"?ins.map(i=>parseEq(i.value,true)):parseEq(ins[0].value);draw();update()}catch(e){$("message").textContent=e.message}}
function generate(){let g=mode==="two"?makeSystem($("diff").value):makeOne($("diff").value);if(!g)return;g.lines.forEach((s,i)=>ins[i].value=s);ins.forEach(i=>i.readOnly=true);drawAll()}function setMode(m){mode=m;$("one").classList.toggle("on",m==="one");$("two").classList.toggle("on",m==="two");$("e2").classList.toggle("hide",m==="one");$("constants").classList.toggle("hide",m==="two");$("title").textContent=m==="two"?"Váhové soustavy":"Váhové rovnice";$("inputLabel").textContent=m==="two"?"Soustava rovnic":"Rovnice";$("generate").textContent=m==="two"?"Nová soustava":"Nová rovnice";$("custom").textContent=m==="two"?"Vlastní soustava":"Vlastní rovnice";$("diffLabel").textContent=m==="two"?"Obtížnost:":"Výsledek:";$("diff").innerHTML=m==="two"?'<option value="natural">přirozená čísla</option><option value="integer">celá čísla</option><option value="positive">kladná čísla</option>':'<option value="natural">přirozené číslo</option><option value="integer">celé číslo</option><option value="positive">kladné číslo</option><option value="any">jakýkoli</option>';last=[];$("answers").disabled=true;generate()}
const ascii=s=>new TextEncoder().encode(s);function jpeg(data){let b=atob(data.split(",")[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}function pdf(images){let W=595,H=842,rows=mode==="two"?3:5,ids=images.map((_,i)=>5+i),cmd=[],res=[],ch=(H-24-(rows-1)*6)/rows;cmd.push("0 G 1 w "+(W/2)+" 0 m "+(W/2)+" "+H+" l S");for(let r=1;r<rows;r++){let y=H-12-r*(ch+6)+3;cmd.push("0 G 1 w 0 "+y.toFixed(2)+" m "+W+" "+y.toFixed(2)+" l S")}images.forEach((im,i)=>{let col=i%2,row=Math.floor(i/2),cw=285,dw=cw,dh=Math.min(ch,dw*im.height/im.width),x=10+col*291,y=H-12-row*(ch+6)-dh;res.push('/I'+i+' '+ids[i]+' 0 R');cmd.push('q '+dw+' 0 0 '+dh+' '+x+' '+y+' cm /I'+i+' Do Q')});let objs=[,ascii("<< /Type /Catalog /Pages 2 0 R >>"),ascii("<< /Type /Pages /Kids [3 0 R] /Count 1 >>"),ascii("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << "+res.join(" ")+" >> >> /Contents 4 0 R >>")],stream=ascii(cmd.join("\n"));objs[4]=join([ascii("<< /Length "+stream.length+" >>\nstream\n"),stream,ascii("\nendstream")]);images.forEach((im,i)=>objs[5+i]=join([ascii("<< /Type /XObject /Subtype /Image /Width "+im.width+" /Height "+im.height+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+im.bytes.length+" >>\nstream\n"),im.bytes,ascii("\nendstream")]));let out=[ascii("%PDF-1.4\n")],off=[0],pos=9;for(let i=1;i<objs.length;i++){off[i]=pos;let o=join([ascii(i+" 0 obj\n"),objs[i],ascii("\nendobj\n")]);out.push(o);pos+=o.length}let xr=pos,s="xref\n0 "+objs.length+"\n0000000000 65535 f \n";for(let i=1;i<objs.length;i++)s+=String(off[i]).padStart(10,"0")+" 00000 n \n";out.push(ascii(s+"trailer\n<< /Size "+objs.length+" /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF"));return new Blob(out,{type:"application/pdf"})}function join(ps){let n=ps.reduce((a,b)=>a+b.length,0),u=new Uint8Array(n),o=0;ps.forEach(p=>{u.set(p,o);o+=p.length});return u}function save(b,n){let u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function download(){try{let items=[];if(mode==="two"){for(let i=0;i<6;i++)items.push(makeSystem($("diff").value).data)}else{let ns=[$("pc"),$("ic"),$("fc")].map(x=>+x.value);if(ns.reduce((a,b)=>a+b,0)!==10)throw Error("Součet počtů musí být přesně 10.");[["natural",ns[0]],["integer",ns[1]],["fraction",ns[2]]].forEach(([k,n])=>{for(let i=0;i<n;i++)items.push(makeOne(k).data)})}last=items;let saved=cur,ims=items.map(x=>{draw(x);return{bytes:jpeg(cv.toDataURL("image/jpeg",.92)),width:cv.width,height:cv.height}});cur=saved;draw();save(pdf(ims),mode==="two"?"pracovni-list-vahove-soustavy.pdf":"pracovni-list-vahove-rovnice.pdf");$("answers").disabled=false;dialog.close()}catch(e){$("sheetError").textContent=e.message}}
function answerImage(item){draw(item);let s=solve(item),label=mode==="two"?`x = ${num(s.x)},  y = ${num(s.y)}`:`x = ${num(s)}`,d=cv.width/700,pad=Math.round(52*d),out=document.createElement("canvas"),o=out.getContext("2d");out.width=cv.width;out.height=cv.height+pad;o.fillStyle=mono?"#fff":"#fbfdff";o.fillRect(0,0,out.width,out.height);o.drawImage(cv,0,0);o.fillStyle=mono?"#000":"#182236";o.font=`700 ${26*d}px Segoe UI,Arial`;o.textAlign="center";o.textBaseline="middle";o.fillText(label,out.width/2,cv.height+pad/2);return{bytes:jpeg(out.toDataURL("image/jpeg",.94)),width:out.width,height:out.height}}
$("one").onclick=()=>setMode("one");$("two").onclick=()=>setMode("two");$("generate").onclick=generate;$("custom").onclick=()=>{ins.forEach((x,i)=>{if(mode==="two"||!i)x.readOnly=false});$("e1").focus()};ins.forEach(x=>x.onkeydown=e=>{if(e.key==="Enter")drawAll()});$("toggle").onclick=()=>{visible=!visible;update()};$("color").onclick=()=>{mono=!mono;$("color").textContent=mono?"●":"◐";draw()};$("copy").onclick=async()=>{try{let b=await new Promise(r=>cv.toBlob(r));await navigator.clipboard.write([new ClipboardItem({"image/png":b})])}catch{$("message").textContent="Obrázek se nepodařilo zkopírovat."}};$("worksheet").onclick=()=>{$("singleSettings").classList.toggle("hide",mode==="two");$("systemInfo").classList.toggle("hide",mode==="one");$("dialogTitle").textContent=mode==="two"?"Pracovní list – soustavy":"Pracovní list – rovnice";$("dialog").showModal()};$("download").onclick=download;$("answers").onclick=()=>{if(last.length){let saved=cur,ims=last.map(answerImage);cur=saved;draw();save(pdf(ims),"vysledky-"+(mode==="two"?"soustavy":"rovnice")+".pdf")}};if(location.hash==="#system")setMode("two");else{$("e1").value="3x + 5 = x + 9";drawAll()}
</script></body></html>
